name: firmware-stable
on:
  workflow_dispatch:
    inputs:
      runner_arch:
        type: choice
        description: 'Build worker architecture'
        required: false
        default: 'arm64'
        options:
          - arm64
          - x86_64
      branch:
        type: string
        description: 'Branch to build from'
        required: true
        default: 'ciao'
      tg_disabled:
        type: boolean
        description: 'Disable Telegram notifications'
        required: false
        default: true
      tg_scratch:
        type: boolean
        description: 'Use TG scratch channel'
        required: false
        default: false
      graph_enabled:
        type: boolean
        description: 'Enable build time graph'
        required: false
        default: false
      teacup_only:
        type: boolean
        description: 'Only build Tea Cup profile'
        required: false
        default: false
      debug_enabled:
        type: boolean
        description: 'Debug: Generate dummy image files'
        required: false
        default: false
      board_list:
        type: string
        description: 'Comma-separated list of boards to build (e.g. board1,board2)'
        required: false
        default: 'iflytek_xfp301m_t31x_jxq03_rtl8188ftv'
      skip_release:
        type: boolean
        description: 'Do not publish to a GitHub release (test build)'
        required: false
        default: true
      update_ingenic_lib_config:
        type: boolean
        description: 'Update ingenic-lib configuration'
        required: false
        default: false
      update_prudynt_config:
        type: boolean
        description: 'Update prudynt-t.mk configuration'
        required: false
        default: false
      prudynt-t-checkout:
        type: string
        description: 'Tag or branch name to checkout for prudynt-t. If not provided, uses latest tag.'
        required: false
      prudynt-t-signature:
        type: boolean
        description: 'Enable prudynt-t signature verification'
        required: false
        default: false
      prudynt-t-device-id:
        type: string
        description: 'Device ID for the prudynt-t build'
        required: false
      prudynt-t-mac:
        type: string
        description: 'MAC address for the prudynt-t build'
        required: false

env:
  BR2_DL_DIR: ~/dl
  FORCE_UNSAFE_CONFIGURE: 1
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG_NAME: firmware
  TERM: linux
  TG_TOKEN: ${{secrets.TELEGRAM_TOKEN_BOT_THINGINO}}
  TG_CHANNEL: ${{secrets.TELEGRAM_CHANNEL_THINGINO_MULTI}}
  TG_TOPIC: ${{secrets.TELEGRAM_CHANNEL_THINGINO_MULTI_TOPIC_FIRMWARE}}
  TG_CHANNEL_SCRATCH: ${{secrets.TELEGRAM_CHANNEL_THINGINO_SCRATCH}}
  TZ: UTC
  # Prebuilt CLI from the buildscope repo's release.
  BUILDSCOPE_VERSION: v0.1.9

jobs:
  check-updates:
    runs-on: ubuntu-26.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: check inputs
        run: |
          # prudynt-t-signature required device-id and MAC address
          if [[ "${{ github.event.inputs.prudynt-t-signature }}" == "true" ]]; then
            if [[ -z "${{ github.event.inputs.prudynt-t-device-id }}" || -z "${{ github.event.inputs.prudynt-t-mac }}" ]]; then
              echo "prudynt-t-signature required device-id and MAC address"
              exit 1
            fi
          fi

      - name: Check for updates since last release
        id: check
        run: |
          # Always build if manually triggered
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger detected - building"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          LATEST_RELEASE=$(gh release list --repo "$REPO" --json tagName,name | jq -r '.[] | select(.name | startswith("firmware-")) | .tagName' | head -1)
          if [[ -z "$LATEST_RELEASE" ]]; then
            echo "No previous firmware release found - building"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Latest firmware release: $LATEST_RELEASE"
          # SHAs entirely via the API — no checkout needed
          LATEST_RELEASE_COMMIT=$(gh api "repos/$REPO/git/ref/tags/$LATEST_RELEASE" --jq '.object.sha')
          CURRENT_COMMIT=$(gh api "repos/$REPO/commits/$BRANCH" --jq '.sha')
          echo "Latest release commit: $LATEST_RELEASE_COMMIT"
          echo "Current commit:        $CURRENT_COMMIT"
          if [[ "$LATEST_RELEASE_COMMIT" == "$CURRENT_COMMIT" ]]; then
            echo "No new commits since last release - skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New commits detected since last release - building"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  notify-no-build:
    runs-on: ubuntu-26.04
    needs: check-updates
    if: needs.check-updates.outputs.should_build == 'false'
    steps:
      - name: Log no build needed
        run: |
          echo "No new commits detected since last firmware release."
          echo "Skipping scheduled build. Manual runs always build."

  prepare-release:
    runs-on: ubuntu-26.04
    needs: check-updates
    if: needs.check-updates.outputs.should_build == 'true'
    outputs:
      tag_name: ${{ steps.set_tag.outputs.tag_name }}
    steps:
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone ${{ env.TZ }}

      - name: Configure TAG_NAME
        id: set_tag
        run: |
          # TAG_NAME="$TAG_NAME-$(TZ=UTC date +'%Y-%m-%d')"
          BRANCH=${{ github.event.inputs.branch }}
          TAG_NAME="$TAG_NAME-$BRANCH-$(TZ=Asia/Shanghai date +'%Y-%m-%d-%H-%M')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create pre-release (tag + release via API)
        if: ${{ github.event.inputs.skip_release != 'true' }}
        continue-on-error: true
        run: |
          TAG_NAME="${{ env.TAG_NAME }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
          else
            echo "Creating pre-release $TAG_NAME at tip of $BRANCH"
            # gh release create makes the (lightweight) tag at --target AND the release in one API call
            gh release create "$TAG_NAME" --repo "$REPO" --target "$BRANCH" --title "$TAG_NAME" --notes "pre-release: \`\`\`$TAG_NAME\`\`\` is currently being built, please wait..." --prerelease
          fi

  notify-begin:
    runs-on: ubuntu-26.04
    needs: prepare-release
    if: needs.check-updates.outputs.should_build == 'true'
    outputs:
      start_time: ${{ steps.set_output.outputs.time }}
      tg_disabled: ${{ steps.set_env.outputs.tg_disabled }}
    steps:
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone ${{ env.TZ }}

      - name: Save workflow start time to ENV
        id: set_output
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Configure Environment Variables
        id: set_env
        run: |
          echo "TG_DISABLED=${{ github.event.inputs.tg_disabled || 'false' }}" >> $GITHUB_ENV
          echo "tg_disabled=${{ github.event.inputs.tg_disabled || 'false' }}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${{ needs.prepare-release.outputs.tag_name }}" >> $GITHUB_ENV

      - name: Send build start notification via Telegram
        if: env.TG_DISABLED == 'false'
        run: |
          if [[ "${{ github.event.inputs.tg_scratch }}" == 'true' ]]; then
            TG_CHANNEL=${{ env.TG_CHANNEL_SCRATCH }}
            export TG_TOPIC=""
          fi
          # fetch just the notifier script via gh (no curl/wget dependency; works in containers too)
          gh api "repos/${{ github.repository }}/contents/.github/scripts/tg-notify.sh?ref=${{ github.event.inputs.branch || github.ref_name }}" -H "Accept: application/vnd.github.raw" > /tmp/tg-notify.sh
          chmod +x /tmp/tg-notify.sh
          /tmp/tg-notify.sh -s $TG_TOKEN $TG_CHANNEL $TG_TOPIC start $TAG_NAME ${{ github.run_id }} ${{ github.repository }}

  generate-matrix:
    runs-on: ubuntu-26.04
    needs: check-updates
    if: needs.check-updates.outputs.should_build == 'true'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone ${{ env.TZ }}

      - name: Generate device matrix
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          if [[ -n "${{ github.event.inputs.board_list }}" ]]; then
            CONFIGS=$(echo "${{ github.event.inputs.board_list }}" | tr ',' '\n')
          else
            # camera defconfigs via the git-trees API — no checkout needed
            CONFIGS=$(gh api "repos/$REPO/git/trees/$BRANCH?recursive=1" --jq \
              '.tree[].path | select(test("^configs/cameras/.*_defconfig$")) | sub(".*/";"") | sub("_defconfig$";"")' | sort)
            if [[ "${{ github.event.inputs.teacup_only }}" == 'true' ]]; then
              CONFIGS=$(echo "$CONFIGS" | grep teacup)
            fi
          fi
          JSON_MATRIX="{\"thingino-version\": ["
          for CONFIG in $CONFIGS; do
            JSON_MATRIX+="\"${CONFIG}\","
          done
          JSON_MATRIX="${JSON_MATRIX%,}]}"
          echo "Matrix: $JSON_MATRIX"
          echo "matrix=$JSON_MATRIX" >> $GITHUB_OUTPUT

      - name: Ensure ccache release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          # Single pre-matrix create so the fan-out jobs only ever upload/download (no create races).
          if gh release view ccache --repo "$REPO" >/dev/null 2>&1; then
            echo "'ccache' release already exists"
          else
            echo "Creating rolling 'ccache' release"
            gh release create ccache --repo "$REPO" \
              --title "ccache" \
              --notes "Rolling per-branch build ccache (compiler cache). Not a firmware release; do not flash." \
              --latest=false
          fi

  buildroot:
    name: ${{ matrix.thingino-version }}
    needs: [generate-matrix, notify-begin, prepare-release]
    runs-on: ${{ (github.event.inputs.runner_arch == 'x86_64') && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    timeout-minutes: 30
    outputs:
      GIT_HASH: ${{ steps.env.outputs.git_hash }}
      TAG_NAME: ${{ steps.env.outputs.tag_name }}
    defaults:
      run:
        shell: bash
    container:
      image: debian:forky
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.generate-matrix.outputs.matrix)}}
    steps:
      - name: Install GitHub CLI to container
        run: |
          apt-get update
          apt-get install -y curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null

      - name: Update package manager sources
        run: |
          apt-get update

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends --no-install-suggests autoconf build-essential bc ca-certificates cmake cpio curl dosfstools file gawk gh git jq lzop m4 make mtools p7zip-full parted perl procps python3 python3-gmpy2                  rsync tzdata u-boot-tools unzip wget python3 python3-dev python3-setuptools libncurses-dev swig

      - name: Set timezone
        run: |
          ln -sf /usr/share/zoneinfo/${{ env.TZ }} /etc/localtime
          echo ${{ env.TZ }} > /etc/timezone
          DEBIAN_FRONTEND=noninteractive dpkg-reconfigure -f noninteractive tzdata

      - name: Setup gh workspace to container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository source
        uses: actions/checkout@v5
        with:
          submodules: 'true'
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: "1"

      # Locally these are applied by `make update`, which this workflow does not
      # run (its `git pull --rebase` would let parallel matrix jobs drift onto
      # different commits). Without them buildroot has no BR2_mips_xburst2
      # symbol, so configs/fragments/soc-xburst2.fragment is silently dropped
      # and XBurst2 boards build as plain mips32 with -mnan=legacy, which fails
      # to link against the nan2008 external toolchain. Same step as
      # toolchain-aarch64.yaml and toolchain-x86_64.yaml.
      - name: Apply buildroot override patches
        run: |
          PATCH_DIR="package/all-patches/buildroot"
          if [ -d "$PATCH_DIR" ]; then
            for patch in $(find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' | LC_ALL=C sort); do
              abspatch="$(pwd)/$patch"
              if git -C buildroot apply --check "$abspatch" 2>/dev/null; then
                echo "Applying $patch"
                git -C buildroot apply "$abspatch"
              elif git -C buildroot apply -R --check "$abspatch" 2>/dev/null; then
                echo "Already applied: $patch"
              else
                echo "ERROR: failed to apply $patch"
                exit 1
              fi
            done
          fi

      - name: Debug checked out branch and commit
        run: |
          echo "Checked out branch:"
          git branch -a
          echo "HEAD SHA:"
          git rev-parse HEAD
          echo "Last commit:"
          git log --oneline -1

      - name: Configure environment variables
        id: env
        run: |
          echo "WEEK_NUMBER=$(date +%U)" >> $GITHUB_ENV
          echo "CURRENT_YEAR=$(date +%Y)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short ${GITHUB_SHA})" >> $GITHUB_ENV
          echo "GIT_BRANCH=$(git branch --show-current)" >> $GITHUB_ENV
          # ccache is stored per-branch + per-arch on the rolling 'ccache' release.
          CH_IN="${{ github.event.inputs.branch }}"
          CACHE_CHANNEL=$(printf '%s' "${CH_IN:-stable}" | tr -c 'A-Za-z0-9._-' '-')
          echo "CACHE_CHANNEL=${CACHE_CHANNEL}" >> $GITHUB_ENV
          # X64 / ARM64 — caches never share across host arch (different host + cross compilers).
          echo "CACHE_ARCH=${{ runner.arch }}" >> $GITHUB_ENV
          echo "TG_DISABLED=${{ github.event.inputs.tg_disabled || 'false' }}" >> $GITHUB_ENV
          echo "TAG_NAME=${{ needs.prepare-release.outputs.tag_name }}" >> $GITHUB_ENV

          echo "GIT_HASH=$(git rev-parse --short ${GITHUB_SHA})" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${{ needs.prepare-release.outputs.tag_name }}" >> $GITHUB_OUTPUT

      - name: Setup cache directories
        run: |
          mkdir -p ~/.buildroot-ccache
          mkdir -p ~/dl

      - name: Restore ccache from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAM: ${{ matrix.thingino-version }}
        run: |
          REPO="${{ github.repository }}"
          CAM_SAFE=$(printf '%s' "$CAM" | tr -c 'A-Za-z0-9._-' '-')
          mkdir -p /tmp/cc
          # Restore this branch's cache; fall back to master for a warm start (restore-keys analog).
          CANDIDATES="$CACHE_CHANNEL"
          [ "$CACHE_CHANNEL" = "master" ] || CANDIDATES="$CACHE_CHANNEL master"
          restored=""
          for CH in $CANDIDATES; do
            ASSET="ccache-${CH}-${CACHE_ARCH}-${CAM_SAFE}.zip"
            if gh release download ccache --repo "$REPO" --pattern "$ASSET" --dir /tmp/cc 2>/dev/null; then
              echo "Restoring $ASSET ($(du -h "/tmp/cc/$ASSET" 2>/dev/null | cut -f1))"
              ( cd ~ && 7z x -y "/tmp/cc/$ASSET" >/dev/null ) || echo "  7z rc=$? during restore (non-fatal)"
              restored="$ASSET"
              break
            fi
          done
          if [ -n "$restored" ]; then
            echo "ccache dir now: $(du -sh ~/.buildroot-ccache 2>/dev/null | cut -f1) in $(find ~/.buildroot-ccache -type f 2>/dev/null | wc -l) files"
          else
            echo "No ccache asset for ${CAM_SAFE} yet — cold build"
          fi
          exit 0   # ccache restore is best-effort — never fail the build on it

      - name: Fetch buildroot-dl-cache release
        id: find_release
        run: |
          # REPO="${{ github.repository }}"
          REPO="themactep/thingino-firmware"
          RELEASE_TAG=$(gh release list --repo "$REPO" --json name,tagName | jq -r '.[] | select(.name=="buildroot-dl-cache") | .tagName' | sort -r | head -1 || echo "")
          if [ -z "$RELEASE_TAG" ]; then
            echo "Could not find release with name 'buildroot-dl-cache', trying tags starting with 'update_cache'"
            RELEASE_TAG=$(gh release list --repo "$REPO" --json tagName | jq -r '.[] | select(.tagName | startswith("update_cache")) | .tagName' | head -n 1 || echo "")
          fi
          if [ -n "$RELEASE_TAG" ]; then
            echo "Found release with tag: $RELEASE_TAG"
            echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
            echo "release_found=true" >> $GITHUB_OUTPUT
          else
            echo "Warning: Could not find appropriate release, continuing without cache"
            echo "release_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Download buildroot-dl-cache files
        id: download_cache
        if: steps.find_release.outputs.release_found == 'true'
        run: |
          # REPO="${{ github.repository }}"
          REPO="themactep/thingino-firmware"
          RELEASE_TAG="${{ steps.find_release.outputs.release_tag }}"
          mkdir -p /tmp/dl-cache
          echo "Downloading files from release with tag: $RELEASE_TAG"
          set +e
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern "buildroot-dl-cache*" --dir "/tmp/dl-cache"
          DOWNLOAD_EXIT_CODE=$?
          set -e
          if [ $DOWNLOAD_EXIT_CODE -ne 0 ]; then
            echo "Warning: gh command exited with code $DOWNLOAD_EXIT_CODE."
            echo "download_succeeded=false" >> $GITHUB_OUTPUT
          elif [ ! "$(ls -A /tmp/dl-cache/)" ]; then
            echo "Warning: Download directory is empty, no files were downloaded."
            echo "download_succeeded=false" >> $GITHUB_OUTPUT
          else
            echo "Download successful!"
            echo "download_succeeded=true" >> $GITHUB_OUTPUT
          fi
          echo "Downloaded files:"
          ls -la /tmp/dl-cache/ || echo "No files found."

      - name: Extract buildroot-dl-cache
        if: steps.download_cache.outputs.download_succeeded == 'true'
        run: |
          if ls /tmp/dl-cache/buildroot-dl-cache.zip.* &>/dev/null; then
            echo "Extracting split ZIP files..."
            cd ~
            7z x /tmp/dl-cache/buildroot-dl-cache.zip.001 -y
          else
            echo "Extracting single ZIP file..."
            cd ~
            7z x /tmp/dl-cache/buildroot-dl-cache.zip -y
          fi
          if [ -d ~/dl/dl ]; then
            echo "Moving files from ~/dl/dl to ~/dl"
            mv ~/dl/dl/* ~/dl/
            rm -rf ~/dl/dl
          fi
          echo "Verifying extraction:"
          ls -la ~/dl/
          echo "Number of files in ~/dl:"
          find ~/dl -type f | wc -l
          echo "DL cache restored successfully"

      - name: Download buildroot sources if cache missing
        if: steps.find_release.outputs.release_found != 'true' || steps.download_cache.outputs.download_succeeded != 'true'
        run: |
          echo "Buildroot DL cache not available, downloading sources..."
          BOARD=${{ matrix.thingino-version }} make source WORKFLOW=1
          echo "Source download completed"

      - name: Fetch buildscope
        # Not fatal: a report is an extra, and a release asset that will not
        # download is no reason to fail every camera in the matrix. The pack
        # hook skips the scan when buildscope is not on PATH, and the fleet job
        # logs how many reports it actually collected.
        continue-on-error: true
        run: |
          case "$(uname -m)" in
            aarch64) T=aarch64-unknown-linux-musl ;;
            x86_64)  T=x86_64-unknown-linux-musl ;;
            *) echo "no buildscope binary for $(uname -m)"; exit 1 ;;
          esac
          BASE="https://github.com/thingino/buildscope/releases/download/${BUILDSCOPE_VERSION}"
          curl -fsSL "$BASE/buildscope-$T" -o /tmp/buildscope
          curl -fsSL "$BASE/buildscope-$T.sha256sum" -o /tmp/buildscope.sha256sum
          # The published sum names the asset; check it under the staged name.
          sed "s|buildscope-$T|buildscope|" /tmp/buildscope.sha256sum > /tmp/bs.sum
          ( cd /tmp && sha256sum -c bs.sum )
          # Only a verified binary goes on PATH. Installing first and checking
          # after would leave a truncated or wrong one where the pack hook finds
          # and runs it, since this step is deliberately not fatal.
          install -m 0755 /tmp/buildscope /usr/local/bin/buildscope
          buildscope --version

      # -------------------------------start-------------------------------
      - name: download libimp-samples-musl
        if: ${{ github.event.inputs.update_ingenic_lib_config != 'false' }}
        run: |
          gh repo clone gtxaspec/libimp-samples-musl /tmp/libimp-samples-musl
          echo "libimp-samples-musl cloned successfully"
          echo "libimp-samples-musl files:"
          # ls -la /tmp/libimp-samples-musl/
          # ls -la /tmp/libimp-samples-musl/T31/lib/uclibc/
          # ls -la ~/dl/ingenic-lib/
          if [ ! -f ~/dl/ingenic-lib/ingenic-lib-*-git4.tar.gz ]; then
            echo "Warning: ingenic-lib-${hashcode}-git4.tar.gz not found in ~/dl/ingenic-lib/"
            exit 1
          fi
          targzFileName=$(basename ~/dl/ingenic-lib/ingenic-lib-*-git4.tar.gz)
          echo "targzFileName: $targzFileName"
          hashcode=$(basename ~/dl/ingenic-lib/ingenic-lib-*-git4.tar.gz | cut -d '-' -f 3)
          echo "hashcode: $hashcode"
          echo "HASHCODE=${hashcode}" >> ${GITHUB_ENV}

          tar -xzf ~/dl/ingenic-lib/ingenic-lib-${hashcode}*.tar.gz -C ~/dl/ingenic-lib/
          rm -f ~/dl/ingenic-lib/$targzFileName
          dirName=$(basename ~/dl/ingenic-lib/ingenic-lib-*)
          # ls -ltr
          ls -ltr ~/dl/ingenic-lib/${dirName}/
          \cp /tmp/libimp-samples-musl/T31/lib/uclibc/*.so ~/dl/ingenic-lib/${dirName}/T31/lib/1.1.6/uclibc/5.4.0/
          \cp /tmp/libimp-samples-musl/T31/lib/uclibc/*/*.so ~/dl/ingenic-lib/${dirName}/T31/lib/1.1.6/uclibc/5.4.0/
          echo "libimp-samples-musl files copied successfully"
          ls -la ~/dl/ingenic-lib/${dirName}/T31/lib/1.1.6/uclibc/5.4.0/
          currPath=`pwd`
          cd ~/dl/ingenic-lib/
          tar -czf ./$targzFileName ${dirName}
          rm -rf ./${dirName}
          ls -ltr
          echo "$targzFileName compressed successfully"
          cd $currPath

      - name: Update ingenic-lib configuration
        if: ${{ github.event.inputs.update_ingenic_lib_config != 'false' }}
        run: |
          sed -i 's/^INGENIC_LIB_VERSION/# INGENIC_LIB_VERSION/' package/ingenic-lib/ingenic-lib.mk
          sed -i '4i\INGENIC_LIB_VERSION = ${{ env.HASHCODE }}' package/ingenic-lib/ingenic-lib.mk
          cat package/ingenic-lib/ingenic-lib.mk | head -10

          sed -i '51i\default y' package/ingenic-lib/Config.in
          sed -i '58i\default y' package/ingenic-lib/Config.in
          cat package/ingenic-lib/Config.in

      - name: Checkout prudynt-t
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PRIVATE_TOKEN }}
          repository: iborderxm/prudynt-t
          path: ./prudynt-t

      - name: Prepare prudynt-t
        run: |
          ls -ltr ./prudynt-t/
          mv ./prudynt-t /tmp/prudynt-t
          cd /tmp/prudynt-t
          git fetch --all

          CHECKOUT_TARGET="${{ github.event.inputs.prudynt-t-checkout }}"
          
          if [ -n "$CHECKOUT_TARGET" ]; then
            echo "Checking if $CHECKOUT_TARGET exists as branch or tag..."
            # Try to checkout directly (will work for tags and existing local branches)
            if git checkout $CHECKOUT_TARGET; then
              echo "Successfully checked out $CHECKOUT_TARGET"
              TAG=$CHECKOUT_TARGET
            else
              # If direct checkout fails, try to checkout remote branch
              if git checkout -b $CHECKOUT_TARGET origin/$CHECKOUT_TARGET; then
                echo "Successfully checked out remote branch $CHECKOUT_TARGET"
                TAG=$CHECKOUT_TARGET
              else
                echo "ERROR: $CHECKOUT_TARGET not found as branch or tag"
                exit 1
              fi
            fi
          else
            # Use original logic - get latest tag
            TAG=$(git tag --sort=-v:refname | head -1)
            echo "Latest Tag: $TAG"
            
            if [ -z "$TAG" ]; then
              echo "ERROR: No tags found in repository"
              exit 1
            fi
            
            git checkout $TAG
          fi
          
          cd /tmp
          ls -ltr prudynt-t/include/

          # JSON库升级导编译失败
          if [[ "${{ github.event.inputs.prutynt_is_json_new_version }}" == 'false' ]]; then
            echo "prudynt-t JSON library is not new version, update JsonAPI.cpp and Config.cpp"
            # number.integer 替换为 number
            sed -i 's/number.integer/number/g' prudynt-t/src/JsonAPI.cpp
            sed -i 's/number.integer/number/g' prudynt-t/src/Config.cpp
            # number.kind 替换为 number
            sed -i 's/number.kind/number/g' prudynt-t/src/JsonAPI.cpp
            sed -i 's/number.kind/number/g' prudynt-t/src/Config.cpp
            # number.real 替换为 number
            sed -i 's/number.real/number/g' prudynt-t/src/JsonAPI.cpp
            sed -i 's/number.real/number/g' prudynt-t/src/Config.cpp
            # JSON_NUMBER_INT 替换为 JSON_NUMBER
            sed -i 's/JSON_NUMBER_INT/JSON_NUMBER/g' prudynt-t/src/JsonAPI.cpp
            sed -i 's/JSON_NUMBER_INT/JSON_NUMBER/g' prudynt-t/src/Config.cpp
          fi

          mv prudynt-t prudynt-t-${TAG}

          tar -czf ./prudynt-t-${TAG}.tar.gz prudynt-t-${TAG}
          ls -ltr
          mkdir webdir
          mv ./prudynt-t-${TAG}.tar.gz ./webdir/

          echo "PRUDYNT_T_TAG=${TAG}" >> $GITHUB_ENV
          cd $GITHUB_WORKSPACE

      - name: Update webui files
        if: ${{ github.event.inputs.update_prudynt_config != 'false' }}
        run: |
          # 复制当前项目目录到/tmp
          REPO_FULL="${{ github.repository }}"
          REPO_NAME="${REPO_FULL#*/}"
          echo "Repository name: $REPO_NAME"
          echo "copied repository to /tmp/$REPO_NAME"
          cd ../
          cp -r $REPO_NAME /tmp/$REPO_NAME
          ls -ltr /tmp/$REPO_NAME
          cd /tmp/$REPO_NAME
          echo "current branch: $(git branch), prepare to checkout newiborder branch"
          git fetch --all --no-recurse-submodules
          echo "fetched all branches"
          if git show-ref --verify --quiet refs/remotes/origin/newiborder; then
            echo "newiborder branch found"
            git checkout newiborder 
            echo "newiborder branch checked out successfully"
          else
            echo "newiborder branch not found"
            exit 1
          fi

          cd $GITHUB_WORKSPACE
          mkdir -p overlay/etc/init.d
          mkdir -p overlay/usr/sbin

          # fix jct
          # cp -r /tmp/$REPO_NAME/package/thingino-jct/0001-strtok_2_strtok_r.patch package/thingino-jct/

          # cp -r /tmp/$REPO_NAME/package/thingino-webui/files/S99heartbeat package/thingino-webui/files/S99heartbeat

          # cp -r /tmp/$REPO_NAME/overlay/etc/TZ overlay/etc/TZ
          # cp -r /tmp/$REPO_NAME/overlay/lower/etc/timezone overlay/etc/timezone
          echo "CST-8" > overlay/etc/TZ
          echo "Asia/Shanghai" > overlay/etc/timezone

          cp -r /tmp/$REPO_NAME/custom/persondetection.json overlay/etc/persondetection.json
          cp -r /tmp/$REPO_NAME/custom/root overlay/etc/cron/crontabs/root

          # overlay/etc/init.d/S37checkuenv位置待定
          # cp -r /tmp/$REPO_NAME/custom overlay/etc/init.d/S37checkuenv

          cp -r /tmp/$REPO_NAME/custom/S99send2email_persondetection overlay/etc/init.d/S99send2email_persondetection
          cp -r /tmp/$REPO_NAME/custom/send2email_persondetection overlay/usr/sbin/send2email_persondetection
          cp -r /tmp/$REPO_NAME/custom/process_monitor overlay/usr/sbin/process_monitor
          cp -r /tmp/$REPO_NAME/custom/checknet overlay/usr/sbin/checknet
          cp -r /tmp/$REPO_NAME/custom/checknet_prompt overlay/usr/sbin/checknet_prompt
          cp -r /tmp/$REPO_NAME/custom/imapautoclean overlay/usr/sbin/imapautoclean

          chmod 755 overlay/etc/init.d/*
          chmod 755 overlay/usr/sbin/*

          mkdir -p overlay/usr/share/sounds/other
          cp -r /tmp/$REPO_NAME/custom/sounds/* overlay/usr/share/sounds/other/
          chmod 0644 overlay/usr/share/sounds/other/*

          # rm -rf package/thingino-button
          # cp -r /tmp/$REPO_NAME/package/thingino-button package/thingino-button

          # cp -r /tmp/$REPO_NAME/custom/prudynt.json package/prudynt-t/files/prudynt.json
          cp -r /tmp/$REPO_NAME/custom/prudynt.json package/prudynt-t/files/prudynt.json
          cp -r /tmp/$REPO_NAME/custom/send2email package/thingino-send2/files/send2email

          # 配置imapautoclean
          cp -r /tmp/$REPO_NAME/custom/package/imapautoclean package/imapautoclean
          sed -i '/source "$BR2_EXTERNAL_THINGINO_PATH\/package\/lightnvr\/Config.in"/a source "$BR2_EXTERNAL_THINGINO_PATH\/package\/imapautoclean\/Config.in"' Config.in
          cat Config.in | grep imapautoclean

          sed -i '$a BR2_PACKAGE_IMAPAUTOCLEAN=y' configs/cameras/iflytek_xfp301m_t31x_jxq03_rtl8188ftv/iflytek_xfp301m_t31x_jxq03_rtl8188ftv_defconfig 
          cat configs/cameras/iflytek_xfp301m_t31x_jxq03_rtl8188ftv/iflytek_xfp301m_t31x_jxq03_rtl8188ftv_defconfig

          # thingino-wpa_supplicant.mk
          # cp -r /tmp/$REPO_NAME/package/thingino-wpa_supplicant/thingino-wpa_supplicant.mk package/thingino-wpa_supplicant/thingino-wpa_supplicant.mk

          cd package/thingino-webui/files/www
          # 添加html全自动翻译
          sed -i 's@</body>@<script src="https://res.zvo.cn/translate/translate.js"></script><script>translate.language.setLocal('english');translate.language.setDefaultTo('chinese_simplified');translate.listener.start();translate.execute();</script></body>@' *.html
          # 替换bootstrap国内cdn
          sed -i "s|integrity=|integrity1=|g" *.html
          target_key="bootstrap.min.css"
          result=$(grep -r "$target_key" . --include="*.html" | \
          grep 'href=' | \
          sed -n 's/.*href="\([^"]*'$target_key'[^"]*\)".*/\1/p' | \
          sort | uniq)
          for item in $result
          do
              echo "$item"
              sed -i "s|$item|https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css|g" *.html
          done

          target_key="bootstrap-icons.min.css"
          result=$(grep -r "$target_key" . --include="*.html" | \
          grep 'href=' | \
          sed -n 's/.*href="\([^"]*'$target_key'[^"]*\)".*/\1/p' | \
          sort | uniq)
          for item in $result
          do
              echo "$item"
              sed -i "s|$item|https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css|g" *.html
          done

          target_key="bootstrap.bundle.min.js"
          result=$(grep -r "$target_key" . --include="*.html" | \
          grep 'src=' | \
          sed -n 's/.*src="\([^"]*'$target_key'[^"]*\)".*/\1/p' | \
          sort | uniq)
          for item in $result
          do
              echo "$item"
              sed -i "s|$item|https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js|g" *.html
          done

          # 替换时区
          sed -i "s|GMT0|CST-8|g" x/*.cgi
          sed -i "s|GMT0|CST-8|g" x/*.raw

          cd $GITHUB_WORKSPACE
      
      - name: Update prudynt-t.mk configuration
        if: ${{ github.event.inputs.update_prudynt_config != 'false' }}
        run: |
          sed -i 's/^PRUDYNT_T_SITE/# PRUDYNT_T_SITE/' package/prudynt-t/prudynt-t.mk
          sed -i 's/^PRUDYNT_T_VERSION/# PRUDYNT_T_VERSION/' package/prudynt-t/prudynt-t.mk
          sed -i 's/^PRUDYNT_T_GIT_SUBMODULES/# PRUDYNT_T_GIT_SUBMODULES/' package/prudynt-t/prudynt-t.mk
          sed -i '1i\PRUDYNT_T_VERSION = ${{ env.PRUDYNT_T_TAG }}' package/prudynt-t/prudynt-t.mk
          sed -i '2i\PRUDYNT_T_SOURCE = prudynt-t-$(PRUDYNT_T_VERSION).tar.gz' package/prudynt-t/prudynt-t.mk
          sed -i '3i\PRUDYNT_T_SITE = http://127.0.0.1:8000' package/prudynt-t/prudynt-t.mk
          # sed -i 's/\$(shell git show -s --format=%h)/${{ env.PRUDYNT_T_TAG }}/' package/prudynt-t/prudynt-t.mk
          if [[ "${{ github.event.inputs.prudynt-t-signature }}" == "true" ]]; then
            sed -i 's|SDK_VERSION=\"$(SDK_VERSION)\"|SIGNATURE_DEVICE_ID=\"${{ github.event.inputs.prudynt-t-device-id }}\" MAC_ADDRESS=\"${{ github.event.inputs.prudynt-t-mac }}\" SDK_VERSION=\"$(SDK_VERSION)\"|' package/prudynt-t/prudynt-t.mk
            sed -i 's/$(TARGET_CROSS)strip/# $(TARGET_CROSS)strip/' package/prudynt-t/prudynt-t.mk
            sed -i $'/\$(TARGET_CROSS)strip \$(@D)\/bin\/prudynt -o \$(TARGET_DIR)\/usr\/bin\/prudynt/a\\\n\tcp \$(@D)\/bin\/prudynt \$(TARGET_DIR)\/usr\/bin\/prudynt' package/prudynt-t/prudynt-t.mk
          fi

          # Verify the changes
          echo "Updated prudynt-t.mk file:"
          pwd
          cat package/prudynt-t/prudynt-t.mk | head -250

          # 临时移除patch
          rm -rf package/prudynt-t/*.patch

      # --------------------------------end--------------------------------

      - name: Build firmware
        if: ${{ github.event.inputs.debug_enabled != 'true' }}
        env:
          CCACHE_MAXSIZE: "1G"   # bound the per-branch cache so its release asset stays well under 2 GiB
        run: |
          ls -ltr /tmp/webdir/
          cd /tmp/webdir/
          python3 -m http.server 8000 &
          sleep 5
          ps -ef | grep python
          cd $GITHUB_WORKSPACE
          ls -ltr
          BOARD=${{ matrix.thingino-version }} make fast WORKFLOW=1
          TIME=$(date -d @${SECONDS} +%M:%S)
          echo "TIME=${TIME}" >> ${GITHUB_ENV}

      - name: Save ccache to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAM: ${{ matrix.thingino-version }}
        run: |
          REPO="${{ github.repository }}"
          CAM_SAFE=$(printf '%s' "$CAM" | tr -c 'A-Za-z0-9._-' '-')
          ASSET="ccache-${CACHE_CHANNEL}-${CACHE_ARCH}-${CAM_SAFE}.zip"
          # Guard: never overwrite a good cache with an empty one from an early build failure.
          SZ_MB=$(du -sm ~/.buildroot-ccache 2>/dev/null | cut -f1)
          if [ "${SZ_MB:-0}" -lt 5 ]; then
            echo "ccache is only ${SZ_MB:-0} MB — skipping upload (cold/failed build)"
            exit 0
          fi
          mkdir -p /tmp/cc
          ( cd ~ && 7z a -tzip -mx=0 "/tmp/cc/${ASSET}" .buildroot-ccache >/dev/null ) || echo "  7z rc=$? during pack (non-fatal)"
          echo "Uploading ${ASSET} ($(du -h /tmp/cc/${ASSET} 2>/dev/null | cut -f1))"
          gh release upload ccache --repo "$REPO" --clobber "/tmp/cc/${ASSET}" || echo "  ccache upload failed (non-fatal)"
          exit 0   # ccache save is best-effort — never fail the build on it

      - name: Generate debug dummy firmware for workflow testing
        if: ${{ github.event.inputs.debug_enabled == 'true' }}
        run: |
          DYNAMIC_PART="${{ matrix.thingino-version }}"
          mkdir -p ${GITHUB_WORKSPACE}/output/${{ github.event.inputs.branch }}/${DYNAMIC_PART}/images/
          echo "debug" > ${GITHUB_WORKSPACE}/output/${{ github.event.inputs.branch }}/${DYNAMIC_PART}/images/thingino-${DYNAMIC_PART}.bin
          echo "debug uboot" > ${GITHUB_WORKSPACE}/output/${{ github.event.inputs.branch }}/${DYNAMIC_PART}/images/u-boot-lzo-with-spl.bin
          echo "debug kernel" > ${GITHUB_WORKSPACE}/output/${{ github.event.inputs.branch }}/${DYNAMIC_PART}/images/uImage
          echo "debug rootfs" > ${GITHUB_WORKSPACE}/output/${{ github.event.inputs.branch }}/${DYNAMIC_PART}/images/rootfs.squashfs
          echo "debug rootfs" > ${GITHUB_WORKSPACE}/output/${{ github.event.inputs.branch }}/${DYNAMIC_PART}/images/rootfs.tar
          echo "debug sha" > ${GITHUB_WORKSPACE}/output/${{ github.event.inputs.branch }}/${DYNAMIC_PART}/images/thingino-${DYNAMIC_PART}.bin.sha256sum
          echo "TIME=7:77" >> ${GITHUB_ENV}

      - name: Generate build time graphs
        if: ${{ github.event.inputs.graph_enabled == 'true' }}
        run: |
          apt-get install -y --no-install-recommends --no-install-suggests python3-numpy python3-matplotlib
          BOARD=${{ matrix.thingino-version }} make br-graph-build WORKFLOW=1

      - name: Validate compiled firmware artifacts
        run: |
          DYNAMIC_PART="${{ matrix.thingino-version }}"
          OUT_BASE="${GITHUB_WORKSPACE}/output/${{ github.event.inputs.branch }}"
          FW_PATH=${OUT_BASE}/${DYNAMIC_PART}/images/
          FULL_FW=$(find ${OUT_BASE}/${DYNAMIC_PART}*/images/ -name "thingino-${DYNAMIC_PART}.bin" ! -name "*update.bin" | head -n 1)
          FULL_FW_UBOOT=$(find ${OUT_BASE}/${DYNAMIC_PART}*/images/ -name "u-boot-lzo-with-spl.bin" | head -n 1)
          FULL_FW_KERNEL=$(find ${OUT_BASE}/${DYNAMIC_PART}*/images/ -name "uImage" | head -n 1)
          FULL_FW_ROOTFS=$(find ${OUT_BASE}/${DYNAMIC_PART}*/images/ -name "rootfs.squashfs" | head -n 1)
          FULL_FW_ROOTFS_TAR=$(find ${OUT_BASE}/${DYNAMIC_PART}*/images/ -name "rootfs.tar" | head -n 1)
          echo "FULL_FW: $FULL_FW"
          if [[ -n "$FULL_FW" ]]; then
            echo "FW_PATH=${FW_PATH}" >> ${GITHUB_ENV}
            echo "FULL_FW=${FULL_FW}" >> ${GITHUB_ENV}
            echo "FULL_FW_UBOOT=${FULL_FW_UBOOT}" >> ${GITHUB_ENV}
            echo "FULL_FW_KERNEL=${FULL_FW_KERNEL}" >> ${GITHUB_ENV}
            echo "FULL_FW_ROOTFS=${FULL_FW_ROOTFS}" >> ${GITHUB_ENV}
            echo "FULL_FW_ROOTFS_TAR=${FULL_FW_ROOTFS_TAR}" >> ${GITHUB_ENV}
            echo "FULL_FW_SHA=${FULL_FW}.sha256sum" >> ${GITHUB_ENV}
          else
            echo "Matching .bin files not found under: ${OUT_BASE}/${DYNAMIC_PART}*/images/"
            ls -la "${OUT_BASE}" || true
            exit 1
          fi

      - name: Upload buildscope report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: buildscope-report-${{ matrix.thingino-version }}
          # The report sits at the build root, beside uenv.txt, not under
          # images/. The trailing * matches the kernel/libc suffix the output
          # dir carries, same as the find globs above.
          path: ${{ github.workspace }}/output/${{ github.event.inputs.branch }}/${{ matrix.thingino-version }}*/buildscope-report.json
          if-no-files-found: ignore

      - name: Upload duration graph artifact
        if: ${{ github.event.inputs.graph_enabled == 'true' }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.thingino-version }}-build.hist-duration
          path: |
            ${{ github.workspace }}/output/${{ github.event.inputs.branch }}/${{ matrix.thingino-version }}/graphs/build.hist-duration.pdf

      - name: Encrypt firmware artifacts with 7z
        run: |
          mkdir -p encrypted-artifacts
          # 只收集实际存在的文件，避免向 7z 传空路径
          FILES=()
          for f in "${{ env.FULL_FW }}" "${{ env.FULL_FW_UBOOT }}" \
                   "${{ env.FULL_FW_KERNEL }}" "${{ env.FULL_FW_ROOTFS }}" \
                   "${{ env.FULL_FW_ROOTFS_TAR }}" "${{ env.FULL_FW_SHA }}"; do
            if [[ -n "$f" && -f "$f" ]]; then
              FILES+=("$f")
            else
              echo "WARNING: skipping missing/empty file: '$f'"
            fi
          done
          7z a -p"${{ secrets.ARTIFACT_PASSWORD }}" -mhe=on encrypted-artifacts/firmware.7z "${FILES[@]}"

      - name: Upload compiled firmware artifacts
        uses: actions/upload-artifact@v7.0.0
        with:
          name: thingino-${{ matrix.thingino-version }}-firmware-encrypted-${{ env.UPDATE_FW_DATETIME }}
          path: |
            encrypted-artifacts/firmware.7z

      - name: Post compiled firmware artifacts to release
        if: ${{ github.event.inputs.skip_release != 'true' }}
        # run: gh release upload "$TAG_NAME" "$FULL_FW" "$FULL_FW_SHA" --clobber
        run: gh release upload "$TAG_NAME" "encrypted-artifacts/firmware.7z" --clobber

      - name: Package binaries for notification
        run: |
          7z a -t7z -mx=9 -mmt=on /tmp/thingino-${{ matrix.thingino-version }}.7z ${{ env.FULL_FW }} ${{ env.FULL_FW_SHA }}

      - name: Send firmware completion notifications with attachment
        if: ${{ env.TG_DISABLED == 'false' && (env.FULL_FW) }}
        run: |
          if [[ "${{ github.event.inputs.tg_scratch }}" == 'true' ]]; then
            TG_CHANNEL=${{ env.TG_CHANNEL_SCRATCH }}
            export TG_TOPIC=""
          fi
          if [ -n "${{ env.FULL_FW }}" ]; then
          .github/scripts/tg-notify.sh -s $TG_TOKEN $TG_CHANNEL $TG_TOPIC completed $TAG_NAME ${{ github.run_id }} ${{ github.repository }} ${GIT_HASH} ${GIT_BRANCH} ${TAG_NAME} ${TIME} ${{ matrix.thingino-version }} /tmp/thingino-${{ matrix.thingino-version }}.7z
          fi

      - name: Send error notification
        if: ${{ env.TG_DISABLED == 'false' && failure() }}
        run: |
          if [[ "${{ github.event.inputs.tg_scratch }}" == 'true' ]]; then
            TG_CHANNEL=${{ env.TG_CHANNEL_SCRATCH }}
            export TG_TOPIC=""
          fi
          .github/scripts/tg-notify.sh -s $TG_TOKEN $TG_CHANNEL $TG_TOPIC error $TAG_NAME "Github CI build failed!" ${{ github.run_id }} ${{ matrix.thingino-version }} ${{ github.repository }}

  finalize-release:
    needs: [buildroot, prepare-release, check-updates]
    runs-on: ubuntu-26.04
    if: always() && needs.check-updates.outputs.should_build == 'true'
    steps:
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone ${{ env.TZ }}

      - name: Configure Environment
        run: |
          echo "GIT_HASH=${{ needs.buildroot.outputs.git_hash }}" >> $GITHUB_ENV
          echo "TAG_NAME=${{ needs.prepare-release.outputs.tag_name }}" >> $GITHUB_ENV

      - name: Generate release notes
        id: release_notes
        run: |
          # branch-tip short SHA via the API — no checkout / git remote needed
          GIT_HASH=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.inputs.branch || github.ref_name }}" --jq '.sha' | cut -c1-7)
          LAST_RELEASE_TAG=$(gh release list --repo "${{ github.repository }}" --limit 2 --json tagName -q '.[1].tagName')
          if [ -z "$LAST_RELEASE_TAG" ]; then
            echo "No previous release found. Skipping release notes generation."
            echo "RELEASE_NOTES_FILE=$(pwd)/release_notes.md" >> $GITHUB_ENV
            exit 0
          else
            echo "Latest release so far is $LAST_RELEASE_TAG"
          fi
          COMMITS=$(gh api \
            -H "Accept: application/vnd.github.v3+json" \
            /repos/${{ github.repository }}/compare/$LAST_RELEASE_TAG...$GIT_HASH \
            -q '.commits
                | sort_by(.commit.author.date)
                | reverse
                | .[]
                | select(
                    .commit.message != "Merge remote-tracking branch '\''origin/${{ github.event.inputs.branch }}'\''"
                    and (.commit.message | contains("workflow") | not)
                    and (.commit.message | contains("Merge pull request #") | not)
                  )
                | "\(.sha[0:7]) \(.commit.message | gsub("\n"; " "))"')
          if [ -z "$COMMITS" ]; then
            echo "### No changes, nightly rebuild" > release_notes.md
          else
            RELEASE_NOTES="### Changes in this release:\n"
            while IFS= read -r commit; do
              if [ -n "$commit" ]; then
                RELEASE_NOTES="${RELEASE_NOTES}- ${commit}\n"
              fi
            done <<< "$COMMITS"
            echo -e "$RELEASE_NOTES" > release_notes.md
          fi
          echo "RELEASE_NOTES_FILE=$(pwd)/release_notes.md" >> $GITHUB_ENV

      - name: Get release ID and Mark as Latest
        if: ${{ github.event.inputs.skip_release != 'true' }}
        run: |
          echo "Environment variables:"
          echo "TAG_NAME: ${{ env.TAG_NAME }}"
          echo "Checking GH authentication status..."
          gh auth status
          echo "Attempting to fetch release URL for tag ${TAG_NAME}..."
          RELEASE_URL=$(gh release view ${{ env.TAG_NAME }} --repo "${{ github.repository }}" --json url -q ".url")
          echo "RELEASE_URL: $RELEASE_URL"
          if [[ -n "$RELEASE_URL" ]]; then
            echo "Release URL found, attempting to mark as latest..."
            if [[ -f "${{ env.RELEASE_NOTES_FILE }}" ]]; then
              echo "Release notes file exists, including --notes-file..."
              gh release edit ${{ env.TAG_NAME }} --repo "${{ github.repository }}" --latest --draft=false --prerelease=false --notes-file "${{ env.RELEASE_NOTES_FILE }}"
            else
              echo "Release notes file does not exist, skipping --notes-file..."
              gh release edit ${{ env.TAG_NAME }} --repo "${{ github.repository }}" --latest --draft=false --prerelease=false --notes ""
            fi
            echo "Release marked as latest"
          else
            echo "Release not found, skipping latest release update"
          fi

  fleet:
    needs: [buildroot, prepare-release, check-updates]
    runs-on: ubuntu-26.04
    # !cancelled() rather than always(): a run where some cameras failed should
    # still publish a snapshot of the ones that succeeded, but a run somebody
    # cancelled should stop, not carry on and report an error for it.
    if: ${{ !cancelled() && needs.check-updates.outputs.should_build == 'true' && github.event.inputs.skip_release != 'true' }}
    steps:
      - name: Fetch buildscope
        run: |
          T=$([ "$(uname -m)" = aarch64 ] && echo aarch64 || echo x86_64)-unknown-linux-musl
          BASE="https://github.com/thingino/buildscope/releases/download/${BUILDSCOPE_VERSION}"
          mkdir -p bin
          curl -fsSL "$BASE/buildscope-$T" -o /tmp/buildscope
          curl -fsSL "$BASE/buildscope-$T.sha256sum" -o /tmp/buildscope.sha256sum
          sed "s|buildscope-$T|buildscope|" /tmp/buildscope.sha256sum > /tmp/bs.sum
          ( cd /tmp && sha256sum -c bs.sum )
          install -m 0755 /tmp/buildscope bin/buildscope
          bin/buildscope --version

      - name: Collect buildscope reports
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: buildscope-report-*
          path: reports

      - name: Build and publish fleet snapshot
        run: |
          TAG_NAME="${{ needs.prepare-release.outputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            echo "No tag name from prepare-release - nothing to publish"
            exit 0
          fi
          # find(1) exits non-zero when reports/ was never created, because no
          # artifact matched. This shell runs with -e, so without the guard the
          # job dies here and the graceful path below can never run.
          REPORTS=$(find reports -name '*.json' 2>/dev/null || true)
          if [ -z "$REPORTS" ]; then
            echo "No buildscope reports were collected - nothing to publish"
            exit 0
          fi
          echo "Collected $(echo "$REPORTS" | wc -l) reports"
          bin/buildscope export --fleet -o . $REPORTS
          ls -la fleet-index.json fleet-reports.tar.gz
          # --repo explicitly: this job has no checkout, so gh has no git
          # remote to infer the repository from.
          gh release upload "$TAG_NAME" fleet-index.json fleet-reports.tar.gz \
            --repo "${{ github.repository }}" --clobber

  notify-completion:
    needs: [finalize-release, notify-begin]
    runs-on: ubuntu-26.04
    if: always() && needs.check-updates.outputs.should_build == 'true'
    steps:
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone ${{ env.TZ }}

      - name: Configure Environment
        run: |
          echo "TG_DISABLED=${{ github.event.inputs.tg_disabled || 'false' }}" >> $GITHUB_ENV

      - name: Send notify completion summary
        if: ${{ env.TG_DISABLED == 'false' }}
        run: |
          if [[ "${{ github.event.inputs.tg_scratch }}" == 'true' ]]; then
            TG_CHANNEL=${{ env.TG_CHANNEL_SCRATCH }}
            export TG_TOPIC=""
          fi
          START_TIME=${{ needs.notify-begin.outputs.start_time }}
          END_TIME=$(date -u +%s)
          ELAPSED=$((END_TIME - START_TIME))
          ELAPSED_MIN=$((ELAPSED / 60))
          ELAPSED_SEC=$((ELAPSED % 60))
          # fetch just the notifier script via gh (no curl/wget dependency; works in containers too)
          gh api "repos/${{ github.repository }}/contents/.github/scripts/tg-notify.sh?ref=${{ github.event.inputs.branch || github.ref_name }}" -H "Accept: application/vnd.github.raw" > /tmp/tg-notify.sh
          chmod +x /tmp/tg-notify.sh
          /tmp/tg-notify.sh -s $TG_TOKEN $TG_CHANNEL $TG_TOPIC finish ${{ github.workflow }} "${ELAPSED_MIN}m ${ELAPSED_SEC}s" ${{ github.run_id }} ${{ github.repository }}
