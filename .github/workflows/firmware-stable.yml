name: firmware-stable
on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        description: 'Branch, tag, or commit SHA to build from'
        required: true
        default: 'stable20260419'

      board_list:
        type: string
        description: 'Comma-separated list of boards to build (e.g. board1,board2)'
        required: true
        default: 'iflytek_xfp301m_t31x_jxq03_rtl8188ftv'
      debug_enabled:
        type: boolean
        description: 'Enable debug build with sanitizers'
        required: false
        default: false
      update_prudynt_config:
        type: boolean
        description: 'Update prudynt-t.mk configuration'
        required: false
        default: true
      prudynt-t-checkout:
        type: string
        description: 'Tag or branch name to checkout for prudynt-t. If not provided, uses latest tag.'
        required: false
      prudynt-t_json_number_with_integer:
        type: boolean
        description: 'JSON number with integer'
        required: false
        default: false
      prudynt-t-signature:
        type: boolean
        description: 'Enable prudynt-t signature verification'
        required: false
        default: true
      prudynt-t-device-id:
        type: string
        description: 'Device ID for the prudynt-t build'
        required: false
      prudynt-t-mac:
        type: string
        description: 'MAC address for the prudynt-t build'
        required: false
      update_live555_download_path:
        type: boolean
        description: 'Update live555 download path'
        required: false
        default: true
      update_live555_config:
        type: boolean
        description: 'Update live555 configuration'
        required: false
        default: false
      live555_version:
        type: string
        description: 'live555 version (e.g. 2026.05.28)'
        required: false
        default: '2026.05.28'
      update_buildroot:
        type: boolean
        description: 'Update buildroot'
        required: false
        default: true

env:
  BR2_DL_DIR: ~/dl
  FORCE_UNSAFE_CONFIGURE: 1
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TERM: linux

  TZ: Asia/Shanghai

jobs:
  generate-matrix:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: check inputs
        run: |
          # inputs.branch is required
          if [[ -z "${{ github.event.inputs.branch }}" ]]; then
            echo "inputs.branch is required"
            exit 1
          fi
          # prudynt-t-signature required device-id and MAC address
          if [[ "${{ github.event.inputs.prudynt-t-signature }}" == "true" ]]; then
            if [[ -z "${{ github.event.inputs.prudynt-t-device-id }}" || -z "${{ github.event.inputs.prudynt-t-mac }}" ]]; then
              echo "prudynt-t-signature required device-id and MAC address"
              exit 1
            fi
          fi
      - name: Set timezone
        run: |
          sudo timedatectl set-timezone ${{ env.TZ }}

      - name: Configure GH workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || 'stable' }}
          fetch-depth: "0"

      - name: Debug checked out branch and commit
        run: |
          echo "Checked out branch:"
          git branch -a
          echo "HEAD SHA:"
          git rev-parse HEAD
          echo "Last commit:"
          git log --oneline -1

      - name: Generate device matrix
        id: set-matrix
        run: |
          if [[ -n "${{ github.event.inputs.board_list }}" ]]; then
            CONFIGS=$(echo "${{ github.event.inputs.board_list }}" | tr ',' '\n')
          else
            CONFIGS=$(find configs/cameras/ -type f -name "*defconfig" | sort | sed 's|.*/\(.*\)_defconfig|\1|')
          fi
          JSON_MATRIX="{\"thingino-version\": ["
          for CONFIG in $CONFIGS; do
            JSON_MATRIX+="\"${CONFIG}\","
          done
          JSON_MATRIX="${JSON_MATRIX%,}]}"
          echo "Matrix: $JSON_MATRIX"
          echo "matrix=$JSON_MATRIX" >> $GITHUB_OUTPUT

  build-prudynt-t:
    name: ${{ matrix.thingino-version }}
    needs: generate-matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    container:
      image: debian:forky
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.generate-matrix.outputs.matrix)}}
    steps:
      - name: Install GitHub CLI to container
        run: |
          apt-get update
          apt-get install -y curl
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null

      - name: Update package manager sources
        run: |
          apt-get update

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends --no-install-suggests autoconf build-essential bc cmake cpio curl ca-certificates file git gh make gawk jq m4 p7zip-full perl procps python3 python3-dev python3-setuptools lzop rsync tzdata u-boot-tools unzip wget libncurses-dev swig help2man

      - name: Checkout prudynt-t
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PRIVATE_TOKEN }}
          repository: iborderxm/prudynt-t
          path: ./prudynt-t

      - name: Prepare prudynt-t
        run: |
          ls -ltr ./prudynt-t/
          mv ./prudynt-t /tmp/prudynt-t
          cd /tmp/prudynt-t
          git fetch --all

          CHECKOUT_TARGET="${{ github.event.inputs.prudynt-t-checkout }}"
          
          if [ -n "$CHECKOUT_TARGET" ]; then
            echo "Checking if $CHECKOUT_TARGET exists as branch or tag..."
            # Try to checkout directly (will work for tags and existing local branches)
            if git checkout $CHECKOUT_TARGET; then
              echo "Successfully checked out $CHECKOUT_TARGET"
              TAG=$CHECKOUT_TARGET
            else
              # If direct checkout fails, try to checkout remote branch
              if git checkout -b $CHECKOUT_TARGET origin/$CHECKOUT_TARGET; then
                echo "Successfully checked out remote branch $CHECKOUT_TARGET"
                TAG=$CHECKOUT_TARGET
              else
                echo "ERROR: $CHECKOUT_TARGET not found as branch or tag"
                exit 1
              fi
            fi
          else
            # Use original logic - get latest tag
            TAG=$(git tag --sort=-v:refname | head -1)
            echo "Latest Tag: $TAG"
            
            if [ -z "$TAG" ]; then
              echo "ERROR: No tags found in repository"
              exit 1
            fi
            
            git checkout $TAG
          fi
          
          cd /tmp
          ls -ltr prudynt-t/include/

          # JSON库升级导编译失败
          if [[ "${{ github.event.inputs.prudynt-t_json_number_with_integer }}" == 'false' ]]; then
            echo "prudynt-t JSON library is not new version, update JsonAPI.cpp and Config.cpp"
            # 遍历全部文件，替换 number.integer 为 number
            find . -type f -name "*.cpp" -exec sed -i 's/number.integer/number/g' {} \;
            # 遍历全部文件，替换 number.kind 为 number
            find . -type f -name "*.cpp" -exec sed -i 's/number.kind/number/g' {} \;
            # 遍历全部文件，替换 number.real 为 number
            find . -type f -name "*.cpp" -exec sed -i 's/number.real/number/g' {} \;
            # 遍历全部文件，替换 JSON_NUMBER_INT 为 JSON_NUMBER
            find . -type f -name "*.cpp" -exec sed -i 's/JSON_NUMBER_INT/JSON_NUMBER/g' {} \;
          fi

          mv prudynt-t prudynt-t-${TAG}

          tar -czf ./prudynt-t-${TAG}.tar.gz prudynt-t-${TAG}
          ls -ltr
          mkdir webdir
          mv ./prudynt-t-${TAG}.tar.gz ./webdir/

          echo "PRUDYNT_T_TAG=${TAG}" >> $GITHUB_ENV
          cd $GITHUB_WORKSPACE
      
      - name: Set timezone
        run: |
          ln -sf /usr/share/zoneinfo/${{ env.TZ }} /etc/localtime
          echo ${{ env.TZ }} > /etc/timezone
          DEBIAN_FRONTEND=noninteractive dpkg-reconfigure -f noninteractive tzdata

      - name: Setup gh workspace to container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository source
        uses: actions/checkout@v5
        with:
          submodules: 'true'
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: "1"

      - name: Debug checked out branch and commit
        run: |
          echo "Checked out branch:"
          git branch -a
          echo "HEAD SHA:"
          git rev-parse HEAD
          echo "Last commit:"
          git log --oneline -1

      - name: Configure environment variables
        id: env
        run: |
          echo "WEEK_NUMBER=$(date +%U)" >> $GITHUB_ENV
          echo "CURRENT_YEAR=$(date +%Y)" >> $GITHUB_ENV
          echo "GIT_HASH=$(git rev-parse --short ${GITHUB_SHA})" >> $GITHUB_ENV
          echo "GIT_BRANCH=$(git branch --show-current)" >> $GITHUB_ENV

      - name: Setup cache directories
        run: |
          mkdir -p ~/.ccache
          mkdir -p ~/dl

      - name: Restore build cache
        uses: actions/cache@v5
        if: always()
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.thingino-version }}-${{ env.CURRENT_YEAR }}-week-${{ env.WEEK_NUMBER }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.thingino-version }}-${{ env.CURRENT_YEAR }}-
            ${{ runner.os }}-ccache-${{ matrix.thingino-version }}-

      - name: Fetch buildroot-dl-cache release
        id: find_release
        run: |
          REPO="${{ github.repository }}"
          echo "打印所有release:"
          gh release list --repo "$REPO" --json name,tagName | jq -r '.[] | {name:.name, tagName:.tagName}'
          echo "打印所有release的tagName:"
          gh release list --repo "$REPO" --json tagName | jq -r '.[] | .tagName'

          RELEASE_TAG=$(gh release list --repo "$REPO" --json name,tagName | jq -r '.[] | select(.name | startswith("buildroot-dl-cache-${{ github.event.inputs.branch }}")) | .tagName' | sort -r | head -1 || echo "")
          if [ -z "$RELEASE_TAG" ]; then
            echo "Could not find release with name starting 'buildroot-dl-cache-${{ github.event.inputs.branch }}', trying tags starting with 'update_cache'"
            RELEASE_TAG=$(gh release list --repo "$REPO" --json tagName | jq -r '.[] | select(.tagName | startswith("update_cache")) | .tagName' | sort -r | head -n 1 || echo "")
          fi
          if [ -n "$RELEASE_TAG" ]; then
            echo "Found release with tag: $RELEASE_TAG"
            echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
            echo "release_found=true" >> $GITHUB_OUTPUT
          else
            echo "Warning: Could not find appropriate release, continuing without cache"
            echo "release_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Download buildroot-dl-cache files
        id: download_cache
        if: steps.find_release.outputs.release_found == 'true'
        run: |
          REPO="${{ github.repository }}"
          RELEASE_TAG="${{ steps.find_release.outputs.release_tag }}"
          mkdir -p /tmp/dl-cache
          echo "Downloading files from release with tag: $RELEASE_TAG"
          set +e
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern "buildroot-dl-cache*" --dir "/tmp/dl-cache"
          DOWNLOAD_EXIT_CODE=$?
          set -e
          if [ $DOWNLOAD_EXIT_CODE -ne 0 ]; then
            echo "Warning: gh command exited with code $DOWNLOAD_EXIT_CODE."
            echo "download_succeeded=false" >> $GITHUB_OUTPUT
          elif [ ! "$(ls -A /tmp/dl-cache/)" ]; then
            echo "Warning: Download directory is empty, no files were downloaded."
            echo "download_succeeded=false" >> $GITHUB_OUTPUT
          else
            echo "Download successful!"
            echo "download_succeeded=true" >> $GITHUB_OUTPUT
          fi
          echo "Downloaded files:"
          ls -la /tmp/dl-cache/ || echo "No files found."

      - name: Extract buildroot-dl-cache
        if: steps.download_cache.outputs.download_succeeded == 'true'
        run: |
          if ls /tmp/dl-cache/buildroot-dl-cache.zip.* &>/dev/null; then
            echo "Extracting split ZIP files..."
            cd ~
            7z x /tmp/dl-cache/buildroot-dl-cache.zip.001 -y
          else
            echo "Extracting single ZIP file..."
            cd ~
            7z x /tmp/dl-cache/buildroot-dl-cache.zip -y
          fi
          if [ -d ~/dl/dl ]; then
            echo "Moving files from ~/dl/dl to ~/dl"
            mv ~/dl/dl/* ~/dl/
            rm -rf ~/dl/dl
          fi
          echo "Verifying extraction:"
          ls -la ~/dl/
          echo "Number of files in ~/dl:"
          find ~/dl -type f | wc -l
          echo "DL cache restored successfully"

      - name: Download buildroot sources if cache missing
        if: steps.find_release.outputs.release_found != 'true' || steps.download_cache.outputs.download_succeeded != 'true'
        run: |
          echo "Buildroot DL cache not available, downloading sources..."
          BOARD=${{ matrix.thingino-version }} make source WORKFLOW=1
          echo "Source download completed"

      - name: Restore libimp-samples-musl cache
        if: ${{ github.event.inputs.update_prudynt_config != 'false' }}
        id: cache-libimp
        uses: actions/cache@v5
        with:
          path: ~/dl/ingenic-lib/ingenic-lib-*-git4.tar.gz
          key: libimp-samples-musl-${{ runner.os }}-${{ hashFiles('~/dl/ingenic-lib/ingenic-lib-*-git4.tar.gz') }}

      - name: download libimp-samples-musl
        if: ${{ github.event.inputs.update_prudynt_config != 'false' && steps.cache-libimp.outputs.cache-hit != 'true' }}
        run: |
          gh repo clone gtxaspec/libimp-samples-musl /tmp/libimp-samples-musl
          echo "libimp-samples-musl cloned successfully"
          echo "libimp-samples-musl files:"
          # ls -la /tmp/libimp-samples-musl/
          # ls -la /tmp/libimp-samples-musl/T31/lib/uclibc/
          # ls -la ~/dl/ingenic-lib/
          if [ ! -f ~/dl/ingenic-lib/ingenic-lib-*-git4.tar.gz ]; then
            echo "Warning: ingenic-lib-${hashcode}-git4.tar.gz not found in ~/dl/ingenic-lib/"
            exit 1
          fi
          targzFileName=$(basename ~/dl/ingenic-lib/ingenic-lib-*-git4.tar.gz)
          echo "targzFileName: $targzFileName"
          hashcode=$(basename ~/dl/ingenic-lib/ingenic-lib-*-git4.tar.gz | cut -d '-' -f 3)
          echo "hashcode: $hashcode"

          tar -xzf ~/dl/ingenic-lib/ingenic-lib-${hashcode}*.tar.gz -C ~/dl/ingenic-lib/
          rm -f ~/dl/ingenic-lib/$targzFileName
          dirName=$(basename ~/dl/ingenic-lib/ingenic-lib-*)
          # ls -ltr
          ls -ltr ~/dl/ingenic-lib/${dirName}/
          \cp /tmp/libimp-samples-musl/T31/lib/uclibc/*.so ~/dl/ingenic-lib/${dirName}/T31/lib/1.1.6/uclibc/5.4.0/
          \cp /tmp/libimp-samples-musl/T31/lib/uclibc/*/*.so ~/dl/ingenic-lib/${dirName}/T31/lib/1.1.6/uclibc/5.4.0/
          echo "libimp-samples-musl files copied successfully"
          ls -la ~/dl/ingenic-lib/${dirName}/T31/lib/1.1.6/uclibc/5.4.0/
          currPath=`pwd`
          cd ~/dl/ingenic-lib/
          tar -czf ./$targzFileName ${dirName}
          rm -rf ./${dirName}
          ls -ltr
          echo "$targzFileName compressed successfully"
          cd $currPath

      - name: download libunistring
        if: ${{ github.event.inputs.update_buildroot != 'false' && steps.cache-libunistring.outputs.cache-hit != 'true' }}
        run: |
          # 下载到/tmp/libunistring
          wget -nv https://github.com/iborderxm/libunistring/archive/refs/tags/1.4.1.tar.gz -O /tmp/libunistring-1.4.1.tar.gz
          echo "libunistring 1.4.1 downloaded successfully"
          tar -xzf /tmp/libunistring-1.4.1.tar.gz -C /tmp/
          echo "libunistring 1.4.1 extracted successfully"
          echo "libunistring 1.4.1 files:"
          # ls -la /tmp/libunistring-1.4.1/
          echo "prepare executed patch"
          patch -d /tmp/libunistring-1.4.1 -p1 < custom/patch/libunistring-1.4.1-0001-fix-gcc15-glibc-const-generic-macros.patch
          echo "libunistring 1.4.1 patch successfully"

          cd /tmp
          rm -rf libunistring-1.4.1.tar.gz
          tar -cJf libunistring-1.4.1.tar.xz libunistring-1.4.1
          echo "libunistring 1.4.1 compressed successfully"
          ls -ltr /tmp/libunistring-1.4.1.tar.xz
          # sha256sum
          hashcode=$(sha256sum libunistring-1.4.1.tar.xz | awk '{print $1}')
          echo "hashcode: $hashcode"
          rm -rf ~/dl/libunistring/*
          mv libunistring-1.4.1.tar.xz ~/dl/libunistring/

          cd $GITHUB_WORKSPACE
          # 更新buildroot/package/libunistring/libunistring.hash
          sed -i "s/67d88430892527861903788868c77802a217b0959990f7449f2976126a307763/$hashcode/" buildroot/package/libunistring/libunistring.hash
          echo "libunistring 1.4.1 hash updated successfully"

      - name: download m4
        if: ${{ github.event.inputs.update_buildroot != 'false' && steps.cache-m4.outputs.cache-hit != 'true' }}
        run: |
          # 下载到/tmp/m4
          wget -nv https://github.com/iborderxm/m4/archive/refs/tags/1.4.20.tar.gz -O /tmp/m4-1.4.20.tar.gz
          echo "m4 1.4.20 downloaded successfully"
          tar -xzf /tmp/m4-1.4.20.tar.gz -C /tmp/
          echo "m4 1.4.20 extracted successfully"
          echo "m4 1.4.20 files:"
          # ls -la /tmp/m4-1.4.20/
          echo "prepare executed patch"
          patch -d /tmp/m4-1.4.20 -p1 < custom/patch/m4-1.4.20-0001-fix-gcc15-glibc-const-generic-macros.patch
          echo "m4 1.4.20 patch successfully"

          cd /tmp
          rm -rf m4-1.4.20.tar.gz
          tar -cJf m4-1.4.20.tar.xz m4-1.4.20
          echo "m4 1.4.20 compressed successfully"
          ls -ltr /tmp/m4-1.4.20.tar.xz
          # sha256sum
          hashcode=$(sha256sum m4-1.4.20.tar.xz | awk '{print $1}')
          echo "hashcode: $hashcode"
          rm -rf ~/dl/m4/*
          mv m4-1.4.20.tar.xz ~/dl/m4/

          cd $GITHUB_WORKSPACE
          # 更新buildroot/package/m4/m4.hash
          sed -i "s/e236ea3a1ccf5f6c270b1c4bb60726f371fa49459a8eaaebc90b216b328daf2b/$hashcode/" buildroot/package/m4/m4.hash
          echo "m4 1.4.20 hash updated successfully"

      - name: download coreutils
        if: ${{ github.event.inputs.update_buildroot != 'false' && steps.cache-coreutils.outputs.cache-hit != 'true' }}
        run: |
          # 下载到/tmp/coreutils
          wget -nv https://github.com/iborderxm/coreutils/archive/refs/tags/9.8.tar.gz -O /tmp/coreutils-9.8.tar.gz
          echo "coreutils 9.8 downloaded successfully"
          tar -xzf /tmp/coreutils-9.8.tar.gz -C /tmp/
          echo "coreutils 9.8 extracted successfully"
          echo "coreutils 9.8 files:"
          # ls -la /tmp/coreutils-9.8/
          echo "prepare executed patch"
          patch -d /tmp/coreutils-9.8 -p1 < custom/patch/coreutils-9.8-0001-fix-gcc15-glibc-const-generic-macros.patch
          echo "coreutils 9.8 patch successfully"

          cd /tmp
          rm -rf coreutils-9.8.tar.gz
          tar -cJf coreutils-9.8.tar.xz coreutils-9.8
          echo "coreutils compressed successfully"
          ls -ltr /tmp/coreutils-9.8.tar.xz
          # sha256sum
          hashcode=$(sha256sum coreutils-9.8.tar.xz | awk '{print $1}')
          echo "hashcode: $hashcode"
          rm -rf ~/dl/coreutils/*
          mkdir -p ~/dl/coreutils/
          mv coreutils-9.8.tar.xz ~/dl/coreutils/

          cd $GITHUB_WORKSPACE
          # 更新buildroot/package/coreutils/coreutils.hash
          sed -i "s/sha1/# sha1/" buildroot/package/coreutils/coreutils.hash
          sed -i "s/e6d4fd2d852c9141a1c2a18a13d146a0cd7e45195f72293a4e4c044ec6ccca15/$hashcode/" buildroot/package/coreutils/coreutils.hash
          echo "coreutils 9.8 hash updated successfully"

      - name: Update ingenic-lib.mk configuration
        if: ${{ github.event.inputs.update_prudynt_config != 'false' }}
        run: |
          sed -i 's/gtxaspec/iborderxm/' package/ingenic-lib/ingenic-lib.mk
          sed -i 's/master/iborder/' package/ingenic-lib/ingenic-lib.mk
          sed -i 's/^INGENIC_LIB_VERSION/# INGENIC_LIB_VERSION/' package/ingenic-lib/ingenic-lib.mk
          sed -i '4i\INGENIC_LIB_VERSION = $(shell git ls-remote $(INGENIC_LIB_SITE) $(INGENIC_LIB_SITE_BRANCH) | head -1 | cut -f1)' package/ingenic-lib/ingenic-lib.mk
          
          # Verify the changes
          echo "Updated ingenic-lib.mk file:"
          pwd
          cat package/ingenic-lib/ingenic-lib.mk | head -10

      - name: Update prudynt-t.mk configuration
        if: ${{ github.event.inputs.update_prudynt_config != 'false' }}
        run: |
          sed -i 's/^PRUDYNT_T_SITE/# PRUDYNT_T_SITE/' package/prudynt-t/prudynt-t.mk
          sed -i 's/^PRUDYNT_T_VERSION/# PRUDYNT_T_VERSION/' package/prudynt-t/prudynt-t.mk
          sed -i 's/^PRUDYNT_T_GIT_SUBMODULES/# PRUDYNT_T_GIT_SUBMODULES/' package/prudynt-t/prudynt-t.mk
          sed -i '1i\PRUDYNT_T_VERSION = ${{ env.PRUDYNT_T_TAG }}' package/prudynt-t/prudynt-t.mk
          sed -i '2i\PRUDYNT_T_SOURCE = prudynt-t-$(PRUDYNT_T_VERSION).tar.gz' package/prudynt-t/prudynt-t.mk
          sed -i '3i\PRUDYNT_T_SITE = http://127.0.0.1:8000' package/prudynt-t/prudynt-t.mk
          sed -i 's/\$(shell git show -s --format=%h)/${{ env.PRUDYNT_T_TAG }}/' package/prudynt-t/prudynt-t.mk
          if [[ "${{ github.event.inputs.prudynt-t-signature }}" == "true" ]]; then
            sed -i 's|SDK_VERSION=\"$(SDK_VERSION)\"|SIGNATURE_DEVICE_ID=\"${{ github.event.inputs.prudynt-t-device-id }}\" MAC_ADDRESS=\"${{ github.event.inputs.prudynt-t-mac }}\" SDK_VERSION=\"$(SDK_VERSION)\"|' package/prudynt-t/prudynt-t.mk
            sed -i 's/$(TARGET_CROSS)strip/# $(TARGET_CROSS)strip/' package/prudynt-t/prudynt-t.mk
            sed -i $'/\$(TARGET_CROSS)strip \$(@D)\/bin\/prudynt -o \$(TARGET_DIR)\/usr\/bin\/prudynt/a\\\n\tcp \$(@D)\/bin\/prudynt \$(TARGET_DIR)\/usr\/bin\/prudynt' package/prudynt-t/prudynt-t.mk
          fi

          if [ "${{ github.event.inputs.debug_enabled }}" == "true" ]; then
            echo "BR2_PACKAGE_PRUDYNT_T_DEBUG = y" >> configs/cameras/${{ github.event.inputs.board_list }}/${{ github.event.inputs.board_list }}_defconfig
            cat configs/cameras/${{ github.event.inputs.board_list }}/${{ github.event.inputs.board_list }}_defconfig | grep "BR2_PACKAGE_PRUDYNT_T_DEBUG"
          fi

          # Verify the changes
          echo "Updated prudynt-t.mk file:"
          pwd
          cat package/prudynt-t/prudynt-t.mk | head -250

      - name: Update live555 download path
        if: ${{ github.event.inputs.update_live555_download_path != 'false' }}
        run: |
          sed -i 's|https://download.videolan.org/contrib/live555|https://github.com/gtxaspec/live555-release-mirror/releases/download/v\$(LIVE555_VERSION)|' package/thingino-live555/live555-override.mk
          cat package/thingino-live555/live555-override.mk | head -12

      - name: Update live555 configuration
        if: ${{ github.event.inputs.update_live555_config != 'false' }}
        run: |
          # 临时修改live555配置
          # 下载 https://github.com/gtxaspec/live555-release-mirror/releases/download/v${{ inputs.live555_version }}/live.${{ inputs.live555_version }}.tar.gz 到/tmp
          wget https://github.com/gtxaspec/live555-release-mirror/releases/download/v${{ inputs.live555_version }}/live.${{ inputs.live555_version }}.tar.gz -P /tmp/
          # 获取 sha256sum
          hashcode=$(sha256sum /tmp/live.${{ inputs.live555_version }}.tar.gz | awk '{print $1}')
          echo "hashcode: $hashcode"
          # 计算sh1sum
          sh1sum=$(sha1sum /tmp/live.${{ inputs.live555_version }}.tar.gz | awk '{print $1}')
          echo "sh1sum: $sh1sum"

          # buildroot/package/live555/live555.hash
          sed -i "s/44eb6ae4ae02ef68a5028d9fc8b70c45b9ba45c058f846b68bc4d32c74355f49/$hashcode/" buildroot/package/live555/live555.hash
          sed -i 's/2025.10.13/${{ inputs.live555_version }}/' buildroot/package/live555/live555.hash
          sed -i 's/sha1/# sha1/' buildroot/package/live555/live555.hash
          sed -i 's/2025.10.13/${{ inputs.live555_version }}/' package/thingino-live555/live555-override.mk

          # Verify the changes
          echo "Updated live555 configuration:"
          cat buildroot/package/live555/live555.hash
          echo "------------------------------------------"
          cat package/thingino-live555/live555-override.mk | head -12

      - name: Update buildroot
        if: ${{ github.event.inputs.update_buildroot != 'false' }}
        run: |
          # 修改buildroot配置
          sed -i '12i\HOST_MKPASSWD_DEPENDENCIES = host-libxcrypt' buildroot/package/mkpasswd/mkpasswd.mk
          cat buildroot/package/mkpasswd/mkpasswd.mk | head -15

          chmod +x scripts/*.sh
          chmod +x scripts/menu/*.sh

      - name: Build prudynt-t only
        run: |
          ls -ltr /tmp/webdir/
          cd /tmp/webdir/
          python3 -m http.server 8000 &
          sleep 5
          ps -ef | grep python
          cd $GITHUB_WORKSPACE
          ls -ltr
          echo "Building prudynt-t for ${{ matrix.thingino-version }}..."
          BOARD=${{ matrix.thingino-version }} make rebuild-prudynt-t WORKFLOW=1
          echo "prudynt-t build completed"

      - name: Verify prudynt-t binary
        run: |
          echo "Verifying prudynt-t binary..."
          PRUDYNT_BIN=$(find ${HOME}/output/${{ github.event.inputs.branch }}/${{ matrix.thingino-version }}-*/per-package/prudynt-t/target/usr/bin/ -name "prudynt" 2>/dev/null | head -n 1)
          if [ -z "$PRUDYNT_BIN" ]; then
            echo "ERROR: prudynt binary not found"
            exit 1
          fi
          echo "Found prudynt binary: $PRUDYNT_BIN"
          ls -lh "$PRUDYNT_BIN"
          file "$PRUDYNT_BIN"
          mkdir -p output/${{ github.event.inputs.branch }}/${{ matrix.thingino-version }}/target/usr/bin
          cp -a "$(dirname "$PRUDYNT_BIN")/"* output/${{ github.event.inputs.branch }}/${{ matrix.thingino-version }}/target/usr/bin/
          ls -ltr output/${{ github.event.inputs.branch }}/${{ matrix.thingino-version }}/target/usr/bin/

          UPDATE_FW_DATETIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d-%H-%M')
          echo "UPDATE_FW_DATETIME=${UPDATE_FW_DATETIME}" >> ${GITHUB_ENV}

      - name: Encrypt prudynt-t binary with 7z
        run: |
          mkdir -p encrypted-artifacts
          cp output/${{ github.event.inputs.branch }}/${{ matrix.thingino-version }}/target/usr/bin/prudynt* ./
          7z a -p"${{ secrets.ARTIFACT_PASSWORD }}" -mhe=on encrypted-artifacts/firmware.7z prudynt*

      - name: Upload prudynt-t binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prudynt-t-${{ matrix.thingino-version }}-${{ env.UPDATE_FW_DATETIME }}
          path: |
            encrypted-artifacts/firmware.7z
          if-no-files-found: error

      - name: Display build summary
        run: |
          echo "=========================================="
          echo "prudynt-t Build Summary for ${{ matrix.thingino-version }}"
          echo "=========================================="
          echo "Branch: ${{ github.event.inputs.branch }}"
          echo "Git Hash: ${{ env.GIT_HASH }}"
          echo "Debug Build: ${{ github.event.inputs.debug_enabled }}"
          echo "=========================================="
